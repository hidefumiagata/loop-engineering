name: test

# 仕組み（手順書・設定・プロンプト・スクリプト・テスト）を変える PR だけで走らせる。
#
# ★ トリガーを広げてはならない。
#   このリポジトリは private で、Actions の無料枠は月2000分しかない
#   （docs/ARCHITECTURE.md「なぜ GitHub Actions ではないのか」）。
#   ループは毎時 push するが、その push は projects/<slug>/ や daily/ しか触らず、
#   テストが落ちる余地が無い。branches: ['**'] にすると月750分ほどを
#   「絶対に落ちない検査」に使うことになる。
#   仕組みを変えるのは人間の PR だけなので、paths でそこに絞る。
on:
  pull_request:
    paths: &machinery
      - 'loop/**'
      - '.claude/**'
      - 'package.json'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths: *machinery

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # サンドボックスと同じ系列に合わせる
      # 依存ゼロなので install は無い。APIキーも不要（テストはネットワークを使わない）
      - run: npm test
